# 3x3 test case geometry definition for IC method testing in self-shielding problems.
# This file describes the geometry of the pincell and assembly, including the fuel radius, gap radius, clad radius, pin pitch, and the lattice description of the assembly. 
# This information is used to build the pincell and assembly geometry for the 3x3 test cases for IC method testing.
PIN_GEOMETRY: 
  fuel_radius: 0.4435
  gap_radius: 0.4520
  clad_radius: 0.5140
  pin_pitch: 1.295
  self_shielding_option: "automatic"
  options_dict: {"num_radial_zones": 1} # only used if self_shielding_option is set to "automatic"

ASSEMBLY_GEOMETRY:
  lattice_type: "Cartesian"
  reactor_type: "BWR"
  lattice_description:
    - ["ROD1", "ROD1", "ROD1"]
    - ["ROD1", "ROD7", "ROD1"]
    - ["ROD1", "ROD1", "ROD1"]

  assembly_pitch: 3.885
  Gd_rod_ids: ["ROD7"]