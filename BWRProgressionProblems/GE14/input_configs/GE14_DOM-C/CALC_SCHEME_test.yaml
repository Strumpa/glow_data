# DRAGON Calculation Scheme for the GE14 BWR progression problem.
# Defines the sequence of calculation steps (self-shielding, flux)
# with their respective discretization options.
#
# This file is separate from the geometry description (GEOM_GE14_DOM-C.yaml)
# and the material compositions (material_compositions.yaml).

DRAGON_CALCULATION_SCHEME:
  name: "GE14_standard"

  steps:


    - name: "FLUXL2_moderator_near_cross_submesh_test"
      step_type: "flux"
      spatial_method: "MOC"
      tracking: "TSPC"
      radial_scheme: "Santamarina"
      export_macros: False
      sectorization:
        enabled: False
        windmill: True
        fuel_pins:
          # UOX pins: 4 Santamarina fuel zones + gap + clad + coolant = 7 regions
          sectors: [8, 8, 8, 8, 8, 8, 8]
          angles:  [22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5]
        Gd_pins:
          # Gd pins: 6 Santamarina fuel zones + gap + clad + coolant = 9 regions
          sectors: [8, 8, 8, 8, 8, 8, 8, 8, 8]
          angles:  [22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5]
        water_rods:
          # Water rods: moderator + clad + coolant = 3 regions
          sectors: [16, 16, 16]
          angles:  [0, 0, 0]

      # Sub-mesh the assembly box periphery for MOC tracking.
      # corner_splits: grid (nx, ny) for each of the 4 corner regions.
      # gap_splits: [n_parallel, n_perpendicular] for unaffected side strips.
      #   Auto-permuted: horizontal strips use (n_par, n_perp) as (nx, ny),
      #   vertical strips use (n_perp, n_par).
      # cross_moderator_discretization: optional sub-meshing for moderator
      #   regions near the control cross. null values → auto-computed from
      #   gap_splits mesh density.
      # control_cross_submesh: optional sub-meshing of the control cross
      #   wings (corner, central structure and absorber pin zones).
      box_discretization:
        enabled: True
        corner_splits: [8, 8]
        gap_splits: [30, 8]      # [n_parallel, n_perpendicular]
        cross_moderator_discretization:
          narrow_gap_splits: [2, 2]    # auto from gap_splits density
          moderator_at_cross_corner_splits: [2, 2]  # auto from gap_splits density
          stub_splits: [2, 2]        # auto from gap_splits density
        control_cross_submesh:
          enabled: false
          control_cross_corner_splits: [2, 2]             # (n_along_arm, n_across_arm)
          central_structure_splits: [3, 4]  # (n_along_arm, n_across_arm)
          extend_splits_at_tube_boundaries: true
          split_tubes_in_half: true
