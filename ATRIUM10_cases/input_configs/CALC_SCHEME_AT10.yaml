# DRAGON Calculation Scheme for the ATRIUM-10 BWR fuel bundle.
# Defines the sequence of calculation steps (self-shielding, flux)
# with their respective discretization options.
#
# This file is separate from the geometry description (GEOM_ATRIUM10.yaml)
# and the material compositions (material_compositions.yaml).

DRAGON_CALCULATION_SCHEME:
  name: "AT10_standard"

  steps:
    # ------------------------------------------------------------------
    # Step 1: Self-shielding (SSH)
    #   - RSE method for resonance self-shielding (energy treatment)
    #   - CP spatial solution for the self-shielding calculation
    #   - TISO tracking (isotropic)
    #   - Santamarina radii for fuel zone subdivision
    #   - No azimuthal sectorization
    # ------------------------------------------------------------------
    - name: "SSH"
      step_type: "self_shielding"
      self_shielding_method: "RSE"
      spatial_method: "IC"
      tracking: "TISO"
      radial_scheme: "Santamarina"
      export_macros: True
      sectorization:
        enabled: True
        windmill: False
        fuel_pins:
          # UOX pins: 4 Santamarina fuel zones + gap + clad + coolant = 7 regions
          sectors: [1, 1, 1, 1, 1, 1, 1]
          angles:  [0, 0, 0, 0, 0, 0, 0]
        Gd_pins:
          # Gd pins: 6 Santamarina fuel zones + gap + clad + coolant = 9 regions
          sectors: [1, 1, 1, 1, 1, 1, 1, 1, 1]
          angles:  [0, 0, 0, 0, 0, 0, 0, 0, 0]
        water_rods:
          # Square water rods: Cartesian grid sub-meshing (nx, ny)
          # Material is reassigned by geometric containment against inner/outer boundaries
          splits: [3, 3]

    # ------------------------------------------------------------------
    # Step 2: 1-st level Flux calculation:
    #   - IC spatial solution for the flux calculation
    #   - TISO tracking
    #   - Santamarina radii for fuel zone subdivision
    #   - Azimuthal sectorization of coolant (8 sectors with 22.5° angle for the coolant regions)
    #   - Windmill sectorization on coolant region
    #   - MACRO properties exported
    #   - box_discretization enabled to sub-mesh the assembly periphery for improved MOC accuracy
    # ------------------------------------------------------------------
    - name: "FLUXL1"
      step_type: "flux"
      spatial_method: "IC"
      tracking: "TISO"
      radial_scheme: "Santamarina"
      export_macros: True
      sectorization:
        enabled: True
        windmill: True
        fuel_pins:
          # UOX pins: 4 Santamarina fuel zones + gap + clad + coolant = 7 regions
          sectors: [1, 1, 1, 1, 1, 1, 8]
          angles:  [0, 0, 0, 0, 0, 0, 22.5]
        Gd_pins:
          # Gd pins: 6 Santamarina fuel zones + gap + clad + coolant = 9 regions
          sectors: [1, 1, 1, 1, 1, 1, 1, 1,  8]
          angles:  [0, 0, 0, 0, 0, 0, 0, 0, 22.5]
        water_rods:
          splits: [3, 3]  # Finer sub-meshing for IC tracking in water rods
    # ------------------------------------------------------------------
    # Step 3 :
    #   - MOC spatial solution for the flux calculation
    #   - TSPC tracking (recommended for MOC)
    #   - Santamarina radii for fuel zone subdivision
    #   - Fine azimuthal sectorization (8 sectors with 22.5° angle for all regions)
    #   - Windmill sectorization on coolant region
    #   - MACRO properties NOT exported
    #   - box_discretization enabled to sub-mesh the assembly periphery for improved MOC accuracy
    # ------------------------------------------------------------------
    - name: "FLUXL2"
      step_type: "flux"
      spatial_method: "MOC"
      tracking: "TSPC"
      radial_scheme: "Santamarina"
      export_macros: False
      sectorization:
        enabled: True
        windmill: True
        fuel_pins:
          # UOX pins: 4 Santamarina fuel zones + gap + clad + coolant = 7 regions
          sectors: [8, 8, 8, 8, 8, 8, 8]
          angles:  [22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5]
        Gd_pins:
          # Gd pins: 6 Santamarina fuel zones + gap + clad + coolant = 9 regions
          sectors: [8, 8, 8, 8, 8, 8, 8, 8, 8]
          angles:  [22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5, 22.5]
        water_rods:
          splits: [25, 25]  # Finer sub-meshing for MOC tracking in water rods
      # Sub-mesh the assembly box periphery for MOC tracking.
      # corner_splits: grid (nx, ny) for each of the 4 corner regions.
      # side_x_splits: grid (nx, ny) for top/bottom strips (defaults to [n_cols, 1]).
      # side_y_splits: grid (nx, ny) for left/right strips (defaults to [1, n_rows]).
      box_discretization:
        enabled: True
        corner_splits: [8, 8]
        side_x_splits: [30, 8]   # [10, 1] by default
        side_y_splits: [8, 30]   # [1, 10] by default